<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobooth Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            background: url('https://source.unsplash.com/random/1920x1080?abstract,gradient') no-repeat center center/cover;
            background-attachment: fixed;
        }
        .glass {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        #flash {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s ease-out;
            z-index: 100;
        }
        .flash-active {
            opacity: 1 !important;
            transition: none !important;
        }
        /* Mirror video for natural look */
        #video {
            transform: scaleX(-1);
        }
        /* Custom Scrollbar for strip */
        .strip-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .strip-scroll::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-gray-800">
    <div id="flash"></div>
    <div class="glass p-6 md:p-8 rounded-3xl shadow-2xl w-full max-w-6xl flex flex-col items-center transition-all">
        <h1 class="text-4xl md:text-5xl font-extrabold mb-8 text-white drop-shadow-lg text-center tracking-wide">✨ Photobooth Pro</h1>

        <div class="flex flex-col lg:flex-row gap-8 w-full">
            <!-- Left Side: Controls & Video -->
            <div class="flex-1 flex flex-col gap-5 relative w-full lg:w-1/2">
                <!-- Camera View -->
                <div class="relative rounded-2xl overflow-hidden shadow-2xl border-4 border-white/50 bg-black aspect-[4/3] flex items-center justify-center group">
                    <video id="video" autoplay class="w-full h-full object-cover"></video>
                    <!-- Timer Display overlay -->
                    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                        <div class="text-[8rem] font-black text-white drop-shadow-[0_4px_8px_rgba(0,0,0,0.8)] opacity-90 transition-transform" id="timer"></div>
                    </div>
                </div>

                <!-- Controls -->
                <div class="bg-white/95 p-6 rounded-2xl shadow-xl flex flex-col gap-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">⏳ Timer (Detik)</label>
                            <input type="number" id="timerValue" min="1" max="10" value="3" class="w-full p-2.5 border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none transition-all font-medium text-center">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">📸 Jumlah Foto</label>
                            <input type="number" id="photoCount" min="1" max="6" value="3" class="w-full p-2.5 border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none transition-all font-medium text-center">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">🎨 Filter Kamera</label>
                            <select id="filter" class="w-full p-2.5 border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none transition-all font-medium bg-white">
                                <option value="none">Tanpa Filter</option>
                                <option value="grayscale(100%)">Grayscale (Hitam Putih)</option>
                                <option value="sepia(100%)">Sepia (Vintage)</option>
                                <option value="invert(100%)">Invert (Negatif)</option>
                                <option value="blur(3px)">Blur (Kabur)</option>
                                <option value="contrast(200%)">Kontras Tinggi</option>
                                <option value="brightness(150%)">Lebih Cerah</option>
                                <option value="saturate(200%)">Saturasi Tinggi</option>
                                <option value="hue-rotate(90deg)">Warna Unik</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">🖼️ Warna Frame</label>
                            <div class="flex gap-2">
                                <input type="color" id="frameColor" value="#ffffff" class="w-full h-[46px] p-1 border-2 border-gray-200 rounded-xl cursor-pointer bg-white transition-all">
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-wrap sm:flex-nowrap gap-3 mt-2">
                        <button class="flex-1 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-transform transform hover:-translate-y-1 active:translate-y-0" id="capture">
                            📸 Mulai Foto
                        </button>
                        <button class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg hidden transition-transform transform hover:-translate-y-1 active:translate-y-0" id="clear">
                            🗑️ Ulangi
                        </button>
                        <button class="flex-1 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg hidden transition-transform transform hover:-translate-y-1 active:translate-y-0" id="download">
                            ⬇️ Simpan Hasil
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right Side: Photo Strip Output -->
            <div class="flex-1 flex flex-col items-center justify-center bg-black/30 p-8 rounded-2xl shadow-inner min-h-[500px] max-h-[80vh] overflow-y-auto strip-scroll w-full lg:w-1/2 relative">

                <div id="photoStripContainer" class="p-4 pb-12 shadow-2xl transition-all duration-300 transform rotate-[-1deg] hover:rotate-0 hover:scale-[1.02] origin-top" style="display: none; background-color: #ffffff;">
                    <div id="photoStrip" class="flex flex-col gap-4"></div>
                    <div class="text-center mt-6 font-black tracking-[0.2em] text-xl" id="stripText" style="color: #000000;">PHOTOBOOTH</div>
                    <div class="text-center mt-1 font-medium tracking-widest text-xs opacity-70" id="dateText"></div>
                </div>

                <div id="emptyState" class="text-white/80 text-center font-medium animate-pulse">
                    <p class="text-7xl mb-4 drop-shadow-md">🎞️</p>
                    <p class="text-xl">Hasil foto akan muncul di sini</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const captureBtn = document.getElementById('capture');
        const downloadBtn = document.getElementById('download');
        const clearBtn = document.getElementById('clear');
        const filterSelect = document.getElementById('filter');
        const timerInput = document.getElementById('timerValue');
        const photoCountInput = document.getElementById('photoCount');
        const frameColorInput = document.getElementById('frameColor');
        const photoStrip = document.getElementById('photoStrip');
        const photoStripContainer = document.getElementById('photoStripContainer');
        const emptyState = document.getElementById('emptyState');
        const timerDisplay = document.getElementById('timer');
        const flash = document.getElementById('flash');
        const stripText = document.getElementById('stripText');
        const dateText = document.getElementById('dateText');

        let photos = [];

        // Access WebCam
        navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } }).then(stream => {
            video.srcObject = stream;
        }).catch(err => {
            console.error("Camera access denied:", err);
            alert("Harap izinkan akses kamera untuk menggunakan photobooth.");
        });

        // Apply Filter
        filterSelect.addEventListener('change', () => {
            video.style.filter = filterSelect.value;
        });

        // Change Frame Color and Auto-adjust Text Color
        frameColorInput.addEventListener('input', () => {
            photoStripContainer.style.backgroundColor = frameColorInput.value;

            // Calculate brightness
            const hex = frameColorInput.value.replace('#', '');
            const r = parseInt(hex.substr(0, 2), 16);
            const g = parseInt(hex.substr(2, 2), 16);
            const b = parseInt(hex.substr(4, 2), 16);
            const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;

            const textColor = (yiq >= 128) ? '#000000' : '#ffffff';
            stripText.style.color = textColor;
            dateText.style.color = textColor;
        });

        // Main Capture Logic
        captureBtn.addEventListener('click', async () => {
            // Setup UI for capturing
            photoStrip.innerHTML = '';
            photos = [];
            photoStripContainer.style.display = 'block';
            emptyState.style.display = 'none';
            downloadBtn.classList.add('hidden');
            clearBtn.classList.add('hidden');

            captureBtn.disabled = true;
            captureBtn.classList.add('opacity-50', 'cursor-not-allowed');
            captureBtn.innerHTML = '📸 Memotret...';

            // Set Date
            const now = new Date();
            dateText.innerText = now.toLocaleDateString('id-ID', { year: 'numeric', month: 'short', day: 'numeric' });

            const totalPhotos = parseInt(photoCountInput.value) || 3;
            const timerSecs = parseInt(timerInput.value) || 3;

            for (let i = 0; i < totalPhotos; i++) {
                // Countdown
                for (let j = timerSecs; j > 0; j--) {
                    timerDisplay.innerText = j;
                    // Add a small pop animation
                    timerDisplay.classList.remove('scale-150');
                    void timerDisplay.offsetWidth; // trigger reflow
                    timerDisplay.classList.add('scale-150');

                    await new Promise(resolve => setTimeout(resolve, 1000));
                }
                timerDisplay.innerText = '';

                triggerFlash();
                takePhoto();

                // Pause slightly to let user see the captured photo appear
                await new Promise(resolve => setTimeout(resolve, 800));
            }

            // Restore UI
            captureBtn.disabled = false;
            captureBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            captureBtn.innerHTML = '📸 Mulai Foto';

            downloadBtn.classList.remove('hidden');
            clearBtn.classList.remove('hidden');

            // Scroll to bottom to see latest photo or download button
            photoStripContainer.scrollIntoView({ behavior: 'smooth', block: 'end' });
        });

        function triggerFlash() {
            flash.classList.add('flash-active');
            // Flash sound can be added here
            setTimeout(() => {
                flash.classList.remove('flash-active');
            }, 100);
        }

        function takePhoto() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            // Use native video resolution
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            // Apply current CSS filter
            ctx.filter = getComputedStyle(video).filter;

            // Mirror image horizontally to match preview
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);

            // Draw frame
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Create image element
            const img = document.createElement('img');
            img.src = canvas.toDataURL('image/jpeg', 0.9);
            img.className = 'w-64 md:w-72 h-auto object-cover border-2 border-black/5 rounded shadow-sm transition-transform hover:scale-105 duration-300';

            photoStrip.appendChild(img);
            photos.push(img);
        }

        // Download logic using html2canvas
        downloadBtn.addEventListener('click', () => {
            // Temporarily remove transform for clean capture
            const originalTransform = photoStripContainer.style.transform;
            photoStripContainer.style.transform = 'none';
            downloadBtn.innerHTML = '⏳ Menyimpan...';

            html2canvas(photoStripContainer, {
                backgroundColor: frameColorInput.value,
                scale: 3, // High quality
                useCORS: true
            }).then(canvas => {
                // Restore transform
                photoStripContainer.style.transform = originalTransform;
                downloadBtn.innerHTML = '⬇️ Simpan Hasil';

                const link = document.createElement('a');
                link.href = canvas.toDataURL('image/jpeg', 0.9);
                link.download = `Photobooth_${new Date().getTime()}.jpg`;
                link.click();
            });
        });

        // Clear logic
        clearBtn.addEventListener('click', () => {
            if(confirm('Yakin ingin menghapus hasil foto ini?')) {
                photoStrip.innerHTML = '';
                photos = [];
                photoStripContainer.style.display = 'none';
                emptyState.style.display = 'block';
                clearBtn.classList.add('hidden');
                downloadBtn.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
